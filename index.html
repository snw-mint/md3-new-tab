<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
    <link rel="preconnect" href="https://api.open-meteo.com" />
    <link rel="preconnect" href="https://geocoding-api.open-meteo.com" />
    <link rel="preconnect" href="https://duckduckgo.com" crossorigin />
    <link rel="stylesheet" href="/src/style.scss" />
    <script src="/scripts/theme-loader.js"></script>
  </head>

  <body>
    <include src="src/icons/symbols.html" />
    <div id="wallpaperLayer" class="wallpaper-layer"></div>
    <div id="wallpaperCredits" class="wallpaper-credits" style="display: none">
      <svg class="wallpaper-credits-icon" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24" fill="currentColor">
        <use href="#icon-info" />
      </svg>
      <span id="wallpaperCreditText" class="wallpaper-credit-text"></span>
    </div>
    <include src="src/html/components/header.html" />

    <div class="container">
      <div id="displayWidget" class="display-widget">
        <div id="greetingsDisplay" class="greetings-text" style="display: none"></div>
        <div id="clockDisplay" class="clock-display" style="display: none"></div>
        <div id="dateDisplay" class="date-display" style="display: none"></div>
      </div>
      <form id="searchForm" action="https://www.google.com/search" method="GET" class="search-bar">
        <div class="wrapper-2" aria-hidden="true">
          <div class="layer-1"></div>
          <div class="layer-2"></div>
          <div class="layer-3"></div>
        </div>
        <div class="search-engine-selector">
          <button type="button" id="engineBtn" class="engine-circle-btn" title="Search Engine">
            <svg class="engine-bg-icon" viewBox="0 0 380 380" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M338.584 190c0 39.407-15.654 77.2-43.519 105.065c-27.865 27.865-65.658 43.519-105.065 43.519c-39.407 0-77.2-15.654-105.065-43.519c-27.865-27.865-43.519-65.658-43.519-105.065c0-39.407 15.654-77.2 43.519-105.065c27.865-27.865 65.658-43.519 105.065-43.519c39.407 0 77.2 15.654 105.065 43.519c27.865 27.865 43.519 65.658 43.519 105.065" fill="currentColor" />
            </svg>
            <div id="currentEngineIcon" class="engine-icon-wrapper"></div>
          </button>
          <div id="engineDropdown" class="dropdown-menu">
            <div class="dropdown-item" data-engine="system">
              <svg xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 0 24 24" width="24" fill="currentColor">
                <use href="#icon-search" />
              </svg>
              <span>System Default</span>
            </div>
            <div class="dropdown-item" data-engine="google">
              <svg viewBox="0 0 16 16" xmlns="http://www.w3.org/2000/svg" fill="currentColor">
                <use href="#icon-engine-google" />
              </svg>
              <span>Google</span>
            </div>
            <div class="dropdown-item" data-engine="bing">
              <svg fill="currentColor" fill-rule="evenodd" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <use href="#icon-engine-bing" />
              </svg>
              <span>Bing</span>
            </div>
            <div class="dropdown-item" data-engine="duck">
              <svg fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <use href="#icon-engine-duck" />
              </svg>
              <span>DuckDuckGo</span>
            </div>
            <div class="dropdown-item" data-engine="brave">
              <svg fill="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                <use href="#icon-engine-brave" />
              </svg>
              <span>Brave Search</span>
            </div>
            <div class="dropdown-item" data-engine="ecosia">
              <svg viewBox="0 0 224.23 221" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <use href="#icon-engine-ecosia" />
              </svg>
              <span>Ecosia Search</span>
            </div>
            <div class="dropdown-item" data-engine="startpage">
              <svg viewBox="0 0 501 501" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
                <use href="#icon-engine-startpage" />
              </svg>
              <span>Start Page</span>
            </div>
            <div class="dropdown-item" data-engine="kagi">
              <svg fill="currentColor" height="500" width="500" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
                <use href="#icon-engine-kagi" />
              </svg>
              <span>Kagi</span>
            </div>
          </div>
        </div>
        <div class="search-input-wrapper">
          <div id="searchAutocompleteGhost" class="search-autocomplete-ghost" aria-hidden="true"></div>
          <input type="text" name="q" id="searchInput" placeholder="Search the web" autocomplete="off" data-i18n="searchPlaceholder" />
        </div>
        <div class="search-actions">
          <button type="button" id="askAiBtn" class="action-btn ask-ai-btn" title="Ask to AI" aria-label="Ask to AI" style="display: none">
            <svg class="ask-ai-icon-inactive" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3 12a9 9 0 0 0 9-9 9 9 0 0 0 9 9 9 9 0 0 0-9 9 9 9 0 0 0-9-9Z"/></svg>
            <svg class="ask-ai-icon-active" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" fill-rule="evenodd" style="display: none"><path d="M20.616 10.835a14.2 14.2 0 0 1-4.45-3.001 14.1 14.1 0 0 1-3.678-6.452.503.503 0 0 0-.975 0 14.13 14.13 0 0 1-3.679 6.452 14.2 14.2 0 0 1-4.45 3.001q-.976.42-2.002.678a.502.502 0 0 0 0 .975q1.025.258 2.002.677a14.2 14.2 0 0 1 4.45 3.001 14.1 14.1 0 0 1 3.679 6.453.502.502 0 0 0 .975 0q.258-1.026.677-2.003a14.2 14.2 0 0 1 3.001-4.45 14.1 14.1 0 0 1 6.453-3.678.503.503 0 0 0 0-.975 13 13 0 0 1-2.003-.678"/></svg>
          </button>
          <button type="button" id="voiceSearchBtn" class="action-btn voice-search-btn" title="Voice search" aria-label="Voice search" style="display: none">
            <div class="voice-bg-wrapper">
              <svg class="voice-bg-icon" width="380" height="380" viewBox="0 0 380 380" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M175.147 33.15c6.836-10.867 22.87-10.867 29.706 0l16.385 26.05c4.493 7.146 13.559 10.05 21.454 6.875l28.783-11.578c12.007-4.83 24.98 4.464 24.032 17.218l-2.272 30.573c-.623 8.385 4.98 15.99 13.259 17.996l30.187 7.317c12.594 3.052 17.549 18.091 9.18 27.86L325.8 178.877a17.054 17.054 0 0 0 0 22.246l20.061 23.416c8.369 9.769 3.414 24.808-9.18 27.86l-30.187 7.317c-8.279 2.006-13.882 9.611-13.259 17.996l2.272 30.573c.948 12.754-12.025 22.048-24.032 17.218l-28.783-11.578c-7.895-3.176-16.961-.271-21.454 6.874l-16.385 26.05c-6.836 10.868-22.87 10.868-29.706 0l-16.385-26.05c-4.493-7.145-13.559-10.05-21.454-6.874l-28.783 11.578c-12.007 4.83-24.98-4.464-24.032-17.218l2.272-30.573c.623-8.385-4.98-15.99-13.26-17.996l-30.186-7.317c-12.594-3.052-17.549-18.091-9.18-27.86l20.06-23.416a17.054 17.054 0 0 0 0-22.246l-20.06-23.416c-8.369-9.769-3.414-24.808 9.18-27.86l30.187-7.317c8.279-2.006 13.882-9.611 13.259-17.996l-2.272-30.573c-.948-12.754 12.025-22.048 24.032-17.218l28.783 11.578c7.895 3.176 16.961.27 21.454-6.874z" fill="currentColor"/>
              </svg>
            </div>
            <svg class="voice-icon-inactive" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor"><path d="M395-435q-35-35-35-85v-240q0-50 35-85t85-35 85 35 35 85v240q0 50-35 85t-85 35-85-35m45 275v-83q-92-13-157.5-78T203-479q-2-17 9-29t28-12 28.5 11.5T284-480q14 70 69.5 115T480-320q72 0 127-45.5T676-480q4-17 15.5-28.5T720-520t28 12 9 29q-14 91-79 157t-158 79v83q0 17-11.5 28.5T480-120t-28.5-11.5T440-160m68.5-331.5Q520-503 520-520v-240q0-17-11.5-28.5T480-800t-28.5 11.5T440-760v240q0 17 11.5 28.5T480-480t28.5-11.5"/></svg>
            <svg class="voice-icon-active" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor" style="display: none"><path d="M395-435q-35-35-35-85v-240q0-50 35-85t85-35 85 35 35 85v240q0 50-35 85t-85 35-85-35m45 275v-83q-92-13-157.5-78T203-479q-2-17 9-29t28-12 28.5 11.5T284-480q14 70 69.5 115T480-320q72 0 127-45.5T676-480q4-17 15.5-28.5T720-520t28 12 9 29q-14 91-79 157t-158 79v83q0 17-11.5 28.5T480-120t-28.5-11.5T440-160"/></svg>
          </button>
          <button type="submit" class="action-btn search-btn" aria-label="Search">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="currentColor">
              <use href="#icon-search" />
            </svg>
          </button>
        </div>
        <div id="suggestionsContainer" class="suggestions-container"></div>
      </form>
      <div class="shortcuts-area">
        <div id="shortcutsGrid" class="shortcuts-grid"></div>
        <div id="folderBackWrapper" class="folder-back-wrapper">
          <button type="button" id="folderBackBtn" class="folder-back-btn">
            <svg xmlns="http://www.w3.org/2000/svg" height="24px" viewBox="0 0 24 24" width="24px" fill="currentColor">
              <use href="#icon-chevron-left" />
            </svg>
            <span class="folder-back-label" data-i18n="backLabel">Back</span>
          </button>
        </div>
      </div>
    </div>

    <include src="src/html/components/settings-sidebar.html" />
    <include src="src/html/templates/modals.html" />

    <div id="global-snackbar" class="md3-snackbar">
      <div class="md3-snackbar-text" id="snackbarText"></div>
      <button class="md3-snackbar-action" id="snackbarAction" style="display: none"></button>
    </div>

    <div id="md3-custom-select-popup" class="md3-custom-select-popup">
      <div class="md3-custom-select-list"></div>
    </div>
    <div id="cityAutocompletePopup" class="md3-autocomplete-popup md3-custom-select-popup">
      <div id="cityAutocompleteList" class="md3-autocomplete-list md3-custom-select-list"></div>
    </div>
    <script type="module" src="/src/script.ts"></script>
  </body>
</html>
