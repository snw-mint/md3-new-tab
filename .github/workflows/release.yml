name: Release Build

on:
  push:
    tags:
      - 'v*.*.*'
      - 'v*.*'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Inject Chrome Store Link
        run: |
          sed -i 's|##STORE_LINK##|https://chromewebstore.google.com/detail/md3-expressive-new-tab/limheioemdhhaccglmbckadpkmnnkoab/reviews?hl=en-US#:~:text=write%20a%20review|g' index.html
          sed -i 's|##STORE_LINK##|https://chromewebstore.google.com/detail/md3-expressive-new-tab/limheioemdhhaccglmbckadpkmnnkoab/reviews?hl=en-US#:~:text=write%20a%20review|g' src/core/boot/rating.ts

      - name: Run release build (Chrome)
        run: npm run build

      - name: Package Chrome extension
        run: |
          cd dist
          zip -r "../md3-new-tab-v${{ steps.version.outputs.VERSION }}-chrome.zip" . \
            --exclude "*.map" \
            --exclude ".DS_Store"

      - name: Revert Source Files
        run: git checkout index.html src/core/boot/rating.ts

      - name: Inject Edge Store Link
        run: |
          sed -i 's|##STORE_LINK##|https://microsoftedge.microsoft.com/addons/detail/md3-expressive-new-tab/jpdkkcflngfgknbgfdcaffnblbafkjgh/hcohjkajcimobdddlnfnfhdfnbapondc#:~:text=add%20a%20review|g' index.html
          sed -i 's|##STORE_LINK##|https://microsoftedge.microsoft.com/addons/detail/md3-expressive-new-tab/jpdkkcflngfgknbgfdcaffnblbafkjgh/hcohjkajcimobdddlnfnfhdfnbapondc#:~:text=add%20a%20review|g' src/core/boot/rating.ts

      - name: Run release build (Edge)
        run: npm run build

      - name: Package Edge extension
        run: |
          cd dist
          zip -r "../md3-new-tab-v${{ steps.version.outputs.VERSION }}-edge.zip" . \
            --exclude "*.map" \
            --exclude ".DS_Store"

      - name: Revert Source Files for Firefox
        run: git checkout index.html src/core/boot/rating.ts

      - name: Inject Firefox Store Link
        run: |
          sed -i 's|##STORE_LINK##|https://addons.mozilla.org/en-US/firefox/addon/md3-expressive-new-tab/#:~:text=rated|g' index.html
          sed -i 's|##STORE_LINK##|https://addons.mozilla.org/en-US/firefox/addon/md3-expressive-new-tab/#:~:text=rated|g' src/core/boot/rating.ts

      - name: Run release build (Firefox)
        run: |
          mv manifest.json manifest-chrome.json
          cp manifest-firefox.json manifest.json
          npm run build

      - name: Package Firefox extension
        run: |
          cd dist
          zip -r "../md3-new-tab-v${{ steps.version.outputs.VERSION }}-firefox.zip" . \
            --exclude "*.map" \
            --exclude ".DS_Store"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            md3-new-tab-v${{ steps.version.outputs.VERSION }}-chrome.zip
            md3-new-tab-v${{ steps.version.outputs.VERSION }}-edge.zip
            md3-new-tab-v${{ steps.version.outputs.VERSION }}-firefox.zip
          generate_release_notes: true
          draft: true
