                <svg class="icon-check" xmlns="http://www.w3.org/2000/svg" height="24" viewBox="0 -960 960 960" width="24" fill="currentColor">

            <button type="button" class="segmented-btn" data-theme-value="device">

                </svg>

              <span class="btn-label" data-i18n="themeDark">Dark</span>

          </div>

            <div class="palette-card">

            <div class="palette-card">

                  <use href="#icon-check-circle" />
                </svg>
              </button>
            </div>

            <div class="palette-card">
              <button type="button" class="color-circle-btn custom-picker-btn" id="customColorPickerBtn" data-palette="custom" style="--theme-c1: var(--sys-primary-light, #1f1f1f); --theme-c2: var(--sys-primary-container-light, #e3e3e3); --theme-c3: var(--sys-secondary-container-light, #3c3c3c)" title="Custom Color" aria-label="Custom Color">

          </button>

        <div class="settings-group-card">
          <div class="group-header">
            <div class="group-title-wrapper">
              <h3 class="settings-group-title" data-i18n="wallpaperTitle">Wallpaper</h3>
            </div>
            <label class="md3-switch">

              <span class="switch-track">

              </button>

            <hr class="settings-divider" />
            <button type="button" class="settings-button-card" id="advancedWallpaperOptionsBtn">

                <span class="button-card-title" data-i18n="advancedOptionsTitle">Advanced options</span>
                <span class="new-feature-badge" data-i18n="newFeatureBadge">NEW</span>
              </span>

            </button>

        <div class="settings-group-card">
          <div class="group-header">

            </button>

        <div class="settings-group-card">
          <div class="group-header">

              <span class="switch-track">
                <span class="switch-thumb"></span>

                <input type="text" id="weatherCityInput" class="md3-input" placeholder=" " autocomplete="off" />
